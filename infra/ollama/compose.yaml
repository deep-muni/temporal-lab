services:
  ollama:
    image: ${OLLAMA_IMAGE}
    container_name: temporal-lab-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${BIND_HOST}:${OLLAMA_HOST_PORT}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Runs once, then exits: downloads the models (skipped if already in the volume).
  ollama-setup:
    image: ${OLLAMA_IMAGE}
    container_name: temporal-lab-ollama-setup
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for MODEL in ${OLLAMA_MODELS}; do
          ollama pull "$$MODEL"
        done
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama-models:
